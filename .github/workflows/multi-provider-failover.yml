name: Multi-provider failover CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [hotfix/multi-provider-failover-20261122]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: local
      DEMO_MODE: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.sqlite3
      LLM_BASE_URL: https://example.invalid/v1
      LLM_API_KEY: ci-placeholder
      VISION_MODEL_A: ci-vision-a
      VISION_MODEL_B: ci-vision-b
      VISION_MODEL_PRIMARY: ci-vision-primary
      TUTOR_MODEL: ci-tutor
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password-not-used
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      AUTH_SECRET: ci-test-auth-secret-is-different-and-long
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app tests
      - name: Check Alembic migration graph
        run: alembic heads
      - name: Validate Codespaces startup script syntax
        run: bash -n ../scripts/run-codespaces-real.sh
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint (existing hook migration warnings are non-blocking)
        run: >-
          npm run lint -- --rule "react-hooks/set-state-in-effect: warn"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
